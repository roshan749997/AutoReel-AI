services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (Node.js Express)
  # ---------------------------------------------------------------------------
  - type: web
    name: autoreel-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false # Set to deployed Frontend URL (e.g. https://autoreel-ai-1.onrender.com)
      - key: MONGODB_URI
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false # Set to deployed Backend Callback: https://autoreel-ai-2.onrender.com/api/accounts/google/callback
      - key: DRIVE_TRANSFER_REDIRECT_URI
        sync: false # Optional: https://autoreel-ai-2.onrender.com/api/drive-transfer/oauth/callback (or omit to share GOOGLE_REDIRECT_URI)
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_REDIRECT_URI
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site (React Vite)
  # ---------------------------------------------------------------------------
  - type: web
    name: autoreel-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
