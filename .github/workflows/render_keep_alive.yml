name: AutoReel Keep-Alive (bandwidth-light)

on:
  schedule:
    # Every 14 minutes — just under Render's ~15m idle spin-down
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Backend Only
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Backend API
        run: |
          echo "Pinging AutoReel Backend (https://autoreel-ai-fs3l.onrender.com/api/health)..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://autoreel-ai-fs3l.onrender.com/api/health)
          echo "Backend returned HTTP Status: $STATUS_CODE"
          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 400 ]; then
            echo "✔ Backend is awake"
          else
            echo "⚠ Backend status $STATUS_CODE"
          fi

      # Frontend static ping removed — it burned Render static bandwidth without helping the API.
