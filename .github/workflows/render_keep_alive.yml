name: AutoReel 24x7 Keep-Alive & Cloud Monitor

on:
  schedule:
    # Runs every 12 minutes 24/7 (Render spins down after 15 minutes of inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Render Services
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Backend API
        run: |
          echo "Pinging AutoReel Backend (https://autoreel-ai-2.onrender.com/api/health)..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://autoreel-ai-2.onrender.com/api/health)
          echo "Backend returned HTTP Status: $STATUS_CODE"
          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 400 ]; then
            echo "✔ Backend is awake, healthy and active!"
          else
            echo "⚠ Backend woke up or responded with status $STATUS_CODE"
          fi

      - name: Ping Frontend Site
        run: |
          echo "Pinging AutoReel Frontend (https://autoreel-ai-1.onrender.com)..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 https://autoreel-ai-1.onrender.com)
          echo "Frontend returned HTTP Status: $STATUS_CODE"

